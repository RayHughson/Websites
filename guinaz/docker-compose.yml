services:
  guinaz-web:
    build: .
    container_name: guinaz-web
    restart: unless-stopped

    read_only: true

    tmpfs:
      - /tmp:uid=101,gid=101,mode=1770
      - /var/cache/nginx:uid=101,gid=101,mode=0750

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - guinaz_web
      - nginx-proxy-manager_default

networks:
  guinaz_web:
    driver: bridge

  nginx-proxy-manager_default:
    external: true
